<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Register | TYNEX OFFICIAL</title>
  <!-- Favicon Logo -->
  <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/BnmwBb8h/1000153544.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    :root { 
      --bg: #050508; --card: rgba(20, 20, 30, 0.7); --accent: #3b82f6; 
      --border: rgba(255, 255, 255, 0.08); --text-main: #f8fafc; --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; outline: none; }
    body { 
        margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main);
        background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
        height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .signup-box {
        background: var(--card); backdrop-filter: blur(25px); padding: 35px;
        border-radius: 28px; border: 1px solid var(--border); width: 100%; max-width: 440px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.7);
    }
    .logo-area { text-align: center; margin-bottom: 22px; }
    .brand-logo-img { 
        width: 55px; height: 55px; border-radius: 16px; object-fit: cover; 
        margin-bottom: 12px; border: 1px solid rgba(59, 130, 246, 0.5);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); display: inline-block;
    }
    h2 { margin: 0; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
    p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input[type="text"], input[type="email"], input[type="password"] {
        width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.04);
        border: 1px solid var(--border); border-radius: 14px; color: white; font-size: 14px; transition: 0.3s;
    }
    input:focus { border-color: var(--accent); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
    .file-btn {
        background: rgba(255,255,255,0.04); border: 1px dashed var(--border); padding: 10px;
        border-radius: 14px; width: 100%; color: var(--text-dim); font-size: 12px; cursor: pointer; text-align: center;
    }
    .btn-signup {
        width: 100%; padding: 15px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none;
        border-radius: 14px; font-weight: 800; font-size: 15px; margin-top: 10px; cursor: pointer; transition: 0.3s;
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }
    .btn-signup:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .footer-text { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-dim); }
    .footer-text a { color: #60a5fa; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

<div class="signup-box animate__animated animate__fadeInUp">
    <div class="logo-area">
        <img src="https://i.postimg.cc/BnmwBb8h/1000153544.jpg" alt="Logo" class="brand-logo-img">
        <h2>Create Account</h2>
        <p>Join TYNEX OFFICIAL Cloud</p>
    </div>

    <form id="signupForm" enctype="multipart/form-data">
        <div class="input-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="fname" placeholder="TY" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="lname" placeholder="Yamin" required>
            </div>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="tyyamin" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="input-row">
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Confirm</label>
                <input type="password" name="confirm_password" placeholder="••••••••" required>
            </div>
        </div>

        <div class="form-group">
            <label>Profile Picture (Optional)</label>
            <input type="file" name="pfp" id="pfp" style="display: none;" onchange="updateFileName(this)">
            <div class="file-btn" onclick="document.getElementById('pfp').click()" id="file-label">
                <i class="fas fa-image"></i> Click to upload photo
            </div>
        </div>

        <button type="submit" class="btn-signup">REGISTER ACCOUNT</button>
    </form>

    <div class="footer-text">
        Already have an account? <a href="/login">Login here</a>
    </div>
</div>

<script>
function updateFileName(input) {
    const label = document.getElementById('file-label');
    if (input.files.length > 0) {
        label.innerHTML = `<i class="fas fa-check"></i> ${input.files[0].name}`;
        label.style.color = '#fff';
    }
}
document.getElementById('signupForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.innerText = "CREATING..."; btn.disabled = true;
    try {
        const res = await fetch('/signup', { method: 'POST', body: new FormData(e.target) });
        const result = await res.json();
        if (result.status === 'success') {
            Swal.fire({ title: 'Success!', text: 'Account created successfully.', icon: 'success', background: '#12121a', color: '#fff' })
            .then(() => window.location.href = result.url);
        } else {
            Swal.fire({ title: 'Error', text: result.msg, icon: 'error', background: '#12121a', color: '#fff' });
            btn.innerText = "REGISTER ACCOUNT"; btn.disabled = false;
        }
    } catch (err) {
        btn.innerText = "REGISTER ACCOUNT"; btn.disabled = false;
    }
};
</script>
</body>
</html>
