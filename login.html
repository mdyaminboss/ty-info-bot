<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
    <title>Secure Sign In | TYNEX OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --accent: #3b82f6; 
            --accent-glow: rgba(59, 130, 246, 0.5);
            --bg: #050508;
            --card-bg: rgba(20, 20, 30, 0.65);
            --border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.04);
            --text-secondary: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg); height: 100dvh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; position: relative;
        }
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.5; }
        .orb-1 { width: 400px; height: 400px; background: #1d4ed8; top: -10%; left: -10%; }
        .orb-2 { width: 350px; height: 350px; background: #7c3aed; bottom: -10%; right: -10%; }

        .login-card {
            width: 92%; max-width: 420px; background: var(--card-bg); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 32px; padding: 45px 35px; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); z-index: 10;
        }
        .brand-logo-img {
            width: 75px; height: 75px; border-radius: 20px; object-fit: cover; margin: 0 auto 20px;
            border: 1px solid rgba(59, 130, 246, 0.5); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            display: block;
        }
        h2 { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
        .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; }
        .input-wrapper { position: relative; margin-bottom: 20px; text-align: left; }
        .input-wrapper i.main-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 16px; }
        .input-wrapper input {
            width: 100%; padding: 16px 45px 16px 48px; background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 16px; color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        .input-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
        .pass-toggle { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #64748b; cursor: pointer; }
        .btn-submit {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none;
            border-radius: 16px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .footer-link { margin-top: 25px; font-size: 14px; color: var(--text-secondary); }
        .footer-link a { color: #60a5fa; text-decoration: none; font-weight: 700; }
        .swal2-ios-custom { background: rgba(20, 20, 30, 0.95) !important; border-radius: 24px !important; color: white !important; }
    </style>
</head>
<body>
    <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div class="login-card animate__animated animate__zoomIn">
        <img src="https://i.postimg.cc/BnmwBb8h/1000153544.jpg" alt="Tynex Logo" class="brand-logo-img">
        <h2>TYNEX</h2>
        <p class="subtitle">Secure Client Portal by TY YAMIN</p>
        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="input-wrapper">
                <input type="email" name="email" placeholder="Email Address" required>
                <i class="fa-solid fa-envelope main-icon"></i>
            </div>
            <div class="input-wrapper">
                <input type="password" name="password" id="passInput" placeholder="Password" required>
                <i class="fa-solid fa-key main-icon"></i>
                <i class="fa-solid fa-eye-slash pass-toggle" onclick="togglePassword()"></i>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
        <div class="footer-link">New to Tynex? <a href="/signup">Create an account</a></div>
    </div>
    <script>
        function togglePassword() {
            const input = document.getElementById('passInput');
            const icon = document.querySelector('.pass-toggle');
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
            else { input.type = 'password'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
        }
        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.querySelector('span').innerText = 'Authenticating...';
            try {
                const res = await fetch('/login', { method: 'POST', body: new FormData(e.target) });
                const data = await res.json();
                if (res.status === 200) {
                    Swal.fire({ icon: 'success', title: 'Access Granted', text: 'Redirecting...', timer: 1500, showConfirmButton: false, customClass: { popup: 'swal2-ios-custom' } });
                    setTimeout(() => window.location.href = data.url, 1400);
                } else {
                    Swal.fire({ icon: 'error', title: 'Failed', text: data.msg || 'Invalid credentials.', customClass: { popup: 'swal2-ios-custom' } });
                    btn.disabled = false; btn.querySelector('span').innerText = 'Sign In to Dashboard';
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Server connection failed.', customClass: { popup: 'swal2-ios-custom' } });
                btn.disabled = false; btn.querySelector('span').innerText = 'Sign In to Dashboard';
            }
        }
    </script>
</body>
</html>
